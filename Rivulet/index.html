<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>珍珠</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:monospace}
#game,#text{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%}
.play-btn{position:relative;width:80px;height:80px;border:3px solid #fff;border-radius:12px;background:transparent;cursor:pointer;transition:transform .2s,box-shadow .2s;display:flex;align-items:center;justify-content:center}
.play-btn:hover{transform:scale(1.1);box-shadow:0 0 20px rgba(255,255,255,.3)}
.play-btn::before{content:"";width:0;height:0;border-top:18px solid transparent;border-bottom:18px solid transparent;border-left:28px solid #fff;margin-left:6px}
.play-btn.playing::before{width:26px;height:30px;border:none;border-left:8px solid #fff;border-right:8px solid #fff;margin-left:0;box-sizing:border-box}
.progress{width:320px;max-width:80vw;height:24px;margin-top:30px;display:flex;align-items:center;cursor:pointer;touch-action:none;position:relative}
.progress .time{position:absolute;top:100%;margin-top:6px;font-size:13px;color:rgba(255,255,255,.7)}
.progress .time.left{left:0}
.progress .time.right{right:0}
.progress .track{position:relative;width:100%;height:2px;background:rgba(255,255,255,.25)}
.progress .fill{position:absolute;left:0;top:0;height:100%;width:0;background:#fff}
.progress .dot{position:absolute;top:50%;left:0;width:12px;height:12px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 8px rgba(255,255,255,.6);transition:transform .15s}
.progress:hover .dot{transform:translate(-50%,-50%) scale(1.3)}
.btn{position:relative;width:160px;height:60px;margin:20px;font-size:20px;border:none;border-radius:8px;cursor:pointer;transition:transform .2s}
#hint{position:fixed;top:10%;left:50%;transform:translateX(-50%);font-size:18px;transition:color .3s}
#box{max-width:700px;margin:10vh auto;padding:0 20px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.cursor:after{content:"_";animation:blink 1s steps(2) infinite}
@keyframes blink{0%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>

<!-- 开场提问 -->
<div id="game">
    <div id="question" style="margin-bottom:30px;font-size:22px;">赞美诗</div>
    <button id="playBtn" class="play-btn" title="播放"></button>
    <div id="progress" class="progress" title="拖动控制进度">
        <div class="track">
            <div id="fill" class="fill"></div>
            <div id="dot" class="dot"></div>
        </div>
        <span id="curTime" class="time left">0:00</span>
        <span id="totalTime" class="time right">0:00</span>
    </div>
</div>

<!-- 提示 -->
<div id="hint"></div>

<!-- 正文 -->
<div id="text" style="display:none">
    <div id="box"><span id="txt"></span><span class="cursor"></span></div>
</div>

<!-- 背景音乐：预加载，点击即可立即播放 -->
<audio id="bgm" src="Halcon Memories.mp3" preload="auto" loop></audio>

<script>

const text     = document.getElementById('text');
const bgm      = document.getElementById('bgm');
const playBtn  = document.getElementById('playBtn');
const progress = document.getElementById('progress');
const fill     = document.getElementById('fill');
const dot      = document.getElementById('dot');
const curTime  = document.getElementById('curTime');
const totalTime= document.getElementById('totalTime');

// 秒 → "分:秒" 格式
function fmt(sec) {
    sec = Math.floor(sec || 0);
    return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
}

// 音乐信息加载完成后显示总时长
bgm.addEventListener('loadedmetadata', () => {
    totalTime.textContent = fmt(bgm.duration);
});

// 页面一打开就立刻开始缓冲音乐
bgm.load();

// 点击按钮：播放 / 暂停
playBtn.addEventListener('click', () => {
    if (bgm.paused) {
        bgm.play();
        playBtn.classList.add('playing');
        playBtn.title = '暂停';
    } else {
        bgm.pause();
        playBtn.classList.remove('playing');
        playBtn.title = '播放';
    }
});

// 播放时实时更新进度条和当前时间
bgm.addEventListener('timeupdate', () => {
    curTime.textContent = fmt(bgm.currentTime);
    if (!bgm.duration || dragging) return;
    const pct = bgm.currentTime / bgm.duration * 100;
    fill.style.width = pct + '%';
    dot.style.left   = pct + '%';
});

// 拖动进度条控制播放进度
let dragging = false;

function seek(clientX) {
    const rect = progress.getBoundingClientRect();
    let pct = (clientX - rect.left) / rect.width;
    pct = Math.max(0, Math.min(1, pct));
    if (bgm.duration) {
        bgm.currentTime = pct * bgm.duration;
        fill.style.width = pct * 100 + '%';
        dot.style.left   = pct * 100 + '%';
        curTime.textContent = fmt(bgm.currentTime);
    }
}

progress.addEventListener('pointerdown', e => {
    dragging = true;
    progress.setPointerCapture(e.pointerId);
    seek(e.clientX);
});
progress.addEventListener('pointermove', e => {
    if (dragging) seek(e.clientX);
});
progress.addEventListener('pointerup', () => dragging = false);
progress.addEventListener('pointercancel', () => dragging = false);


</script>
</body>
</html>
